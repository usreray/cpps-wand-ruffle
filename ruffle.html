<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Penguin</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #003366;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #D_F_GameSection {
            position: relative;
            width: 960px;
            height: 640px;
        }
        #ruffle-container {
            width: 960px;
            height: 640px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.8);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        ruffle-player {
            width: 100%;
            height: 100%;
        }
        #D_F_FriendSection {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 80px;
            right: 20px;
        }
        /* Hide background error text when Add Friend result card is shown */
        #D_F_AddFriendResults:not(:empty) {
            position: relative;
            z-index: 10;
        }
        #D_F_AddFriendResults:not(:empty) ~ #D_F_AddFriendError,
        #D_F_AddFriendResults:not(:empty) + #D_F_AddFriendError {
            display: none !important;
        }

        /* Registration Success Banner */
        #registration-success-banner {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            animation: slideDown 0.4s ease-out;
        }
        .banner-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: linear-gradient(180deg, #0099ff 0%, #0066cc 100%);
            border: 3px solid #ffcc00;
            border-radius: 12px;
            padding: 12px 20px;
            color: #ffffff;
            font-family: 'Arial Rounded MT Bold', 'Helvetica Neue', Arial, sans-serif;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            min-width: 380px;
            max-width: 540px;
        }
        .banner-icon {
            font-size: 26px;
        }
        .banner-title {
            font-size: 15px;
            font-weight: bold;
            color: #ffea00;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            margin-bottom: 2px;
        }
        .banner-text {
            font-size: 13px;
            color: #e6f3ff;
            line-height: 1.3;
        }
        .banner-close {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            transition: background 0.2s;
        }
        .banner-close:hover {
            background: rgba(255, 0, 0, 0.6);
        }
        @keyframes slideDown {
            from { transform: translate(-50%, -40px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
    </style>

    <!-- 1. Ruffle config MUST be defined before the library -->
    <script>
        const isHttps = window.location.protocol === "https:";
        const wsProto = isHttps ? "wss:" : "ws:";
        const currentHost = window.location.hostname || "127.0.0.1";

        let loginProxyUrl, worldProxyUrl;
        if (window.location.port === "8888") {
            loginProxyUrl = "ws://" + currentHost + ":8080";
            worldProxyUrl = "ws://" + currentHost + ":8081";
        } else {
            loginProxyUrl = wsProto + "//" + window.location.host + "/ws/login";
            worldProxyUrl = wsProto + "//" + window.location.host + "/ws/world";
        }

        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "autoplay": "on",
            "unmuteOverlay": "hidden",
            "letterbox": "on",
            "allowScriptAccess": true,
            "logLevel": "warn",
            "socketProxy": [
                { "host": "127.0.0.1", "port": 6112, "proxyUrl": loginProxyUrl },
                { "host": "localhost", "port": 6112, "proxyUrl": loginProxyUrl },
                { "host": currentHost, "port": 6112, "proxyUrl": loginProxyUrl },
                { "host": "203.0.113.10", "port": 6112, "proxyUrl": loginProxyUrl },
                { "host": "127.0.0.1", "port": 9875, "proxyUrl": worldProxyUrl },
                { "host": "localhost", "port": 9875, "proxyUrl": worldProxyUrl },
                { "host": currentHost, "port": 9875, "proxyUrl": worldProxyUrl },
                { "host": "203.0.113.10", "port": 9875, "proxyUrl": worldProxyUrl }
            ]
        };

        // Hash-based navigation stubs.
        // The CP SWF sets window.location.hash = "#/create" (or ExternalInterface calls
        // navigateHash) to trigger Snowball JS routing. Since ruffle.html doesn't load
        // Snowball JS, we handle these hashes ourselves.
        var HASH_ROUTES = {
            '/create':  '/en/penguin/create/game',
            '/redeem':  '/en/penguin/create/redeem',
            '/upgrade': '/en/penguin/create/game',
            '/login':   '/play/ruffle.html'
        };

        function handleHash(hash) {
            var route = (hash || '').replace(/^#/, '');
            if (HASH_ROUTES[route]) {
                window.location.href = HASH_ROUTES[route];
            }
        }

        // Catch hash changes set by the SWF via ExternalInterface or directly.
        window.addEventListener('hashchange', function() {
            handleHash(window.location.hash);
        });

        // ExternalInterface stubs the SWF may call for navigation.
        window.navigateTo      = function(url) { window.location.href = url; };
        window.renderCreate    = function()    { window.location.href = '/en/penguin/create/game'; };
        window.renderLogin     = function()    { /* already on game page */ };

        // Intercept Ruffle's internal fetch() so that when the main SWF loads
        // create_module.swf via ActionScript Loader, we catch it and redirect
        // the browser to the Dash registration page instead.
        // Ruffle uses window.fetch() to download SWF files, so overriding it
        // here (before Ruffle loads) lets us intercept any sub-SWF request.
        (function() {
            var _origFetch = window.fetch;
            window.fetch = function(input, init) {
                var url = (typeof input === 'string') ? input
                        : (input && input.url) ? input.url
                        : String(input);
                if (url.indexOf('create_module.swf') !== -1) {
                    window.location.href = '/en/penguin/create/game';
                    // Return a promise that never resolves — page is navigating away.
                    return new Promise(function() {});
                }
                return _origFetch.apply(this, arguments);
            };
        })();
    </script>

    <!-- 2. jQuery + UI + libs required by the Disney Friends library -->
    <script src="/media/play/js/lib/jquery.min.js"></script>
    <script src="/media/play/js/lib/jquery.ui.min.js"></script>
    <script src="/media/play/js/lib/libs.min.js"></script>

    <!-- 3. Disney Friends init (loads disney-friends-with-ui-min.js dynamically) -->
    <script src="/media/play/js/disney-friends-ostrta-min.js"></script>

    <!-- 4. Ruffle player library -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('created') === '1') {
                const user = urlParams.get('user') || urlParams.get('u') || 'Penguin';
                const banner = document.getElementById('registration-success-banner');
                const userSpan = document.getElementById('created-username');
                if (banner && userSpan) {
                    userSpan.textContent = user;
                    banner.style.display = 'block';
                    setTimeout(() => {
                        if (banner) banner.style.display = 'none';
                    }, 10000);
                }
            }

            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-container");
            container.appendChild(player);

            // Class required by Disney.Social.getLandDOMElement()
            player.id = "club_penguin";
            player.classList.add("disney_land_clubpenguin_player");

            const base = window.location.protocol + "//" + window.location.host + "/media/play/";
            const SWID = "{00000000-0000-0000-0000-000000000001}";

            player.load({
                url: base + "v2/client/club_penguin.swf?clientVersion=21639",
                allowScriptAccess: true,
                parameters: {
                    "clientVersion": "21639",
                    "client_version": "21639",
                    "baseUrl": base,
                    "base": base,
                    "webService": base + "web_service/",
                    "webServiceUrl": base + "web_service/",
                    "web_service": base + "web_service/",
                    "web_service_path": base + "web_service/",
                    "clientDirectory": base + "v2/client/",
                    "clientPath": "v2/client/",
                    "client_path": "v2/client/",
                    "contentDirectory": base + "v2/content/",
                    "contentPath": "v2/content/",
                    "content_path": "v2/content/",
                    "gamesDirectory": base + "v2/games/",
                    "gamesPath": "v2/games/",
                    "games_path": "v2/games/",
                    "configPath": "v2/client/",
                    "config_path": "v2/client/",
                    "connectionID": "cp68294",
                    "lang": "en",
                    "configVersion": "1485906035",
                    "contentVersion": "84421",
                    "minigameVersion": "13162",
                    "swid": SWID,
                    "a": "",
                    "nau": "",
                    "nal": "",
                    "nas": "",
                    "nad": ""
                }
            });

            // Connect the Disney Friends system after the SWF is loaded.
            // Poll until Disney.Friends is initialized by disney-friends-with-ui-min.js.
            function tryConnectFriends(attempts) {
                if (typeof Disney !== "undefined" &&
                    Disney.Friends &&
                    Disney.Friends.API &&
                    Disney.Friends.Connection) {
                    try {
                        Disney.Friends.API.connect(SWID, "local_token");
                        console.log("[Friends] Connected as SWID:", SWID);

                        // Listen for player search queries from the Disney Friends "Add Friend" box
                        if (Disney.Friends.Event && Disney.Friends.Event.FIND_PLAYER) {
                            Disney.Friends.Event.addListener(Disney.Friends.Event.FIND_PLAYER, function(name) {
                                console.log("[Friends] Searching player:", name);
                                $.ajax({
                                    url: "/datatech/cp/getPublicPlayerDataByDisplayName?displayName=" + encodeURIComponent(name),
                                    dataType: "json",
                                    success: function(resp) {
                                        if (resp && resp.payload && resp.payload.data && resp.payload.data.id > 0) {
                                            var d = resp.payload.data;
                                            console.log("[Friends] Found player:", d);
                                            $("#D_F_AddFriendError").empty().hide();
                                            Disney.Friends.API.foundPlayer({
                                                name: d.displayName,
                                                playerId: d.id,
                                                swid: d.swid || String(d.id)
                                            });
                                            $("#D_F_AddFriendError").empty().hide();
                                        } else {
                                            console.log("[Friends] Player not found:", name);
                                            Disney.Friends.API.foundPlayer({
                                                name: name,
                                                playerId: 0,
                                                swid: ""
                                            });
                                        }
                                    },
                                    error: function() {
                                        Disney.Friends.API.foundPlayer({
                                            name: name,
                                            playerId: 0,
                                            swid: ""
                                        });
                                    }
                                });
                            });
                        }
                    } catch(e) {
                        console.warn("[Friends] connect() failed:", e);
                    }
                } else if (attempts > 0) {
                    setTimeout(() => tryConnectFriends(attempts - 1), 500);
                } else {
                    console.warn("[Friends] Disney.Friends not available after polling.");
                }
            }
            setTimeout(() => tryConnectFriends(20), 1000);
        });

        // ExternalInterface stubs called by the CP SWF via Ruffle.
        // The SWF calls these to open/close the friends panel.
        window.handleShowFriends = function() {
            try { if (Disney && Disney.Friends) Disney.Friends.API.toggle(null); } catch(e) {}
        };
        window.handleHideFriends = function() {
            try { if (Disney && Disney.Friends) Disney.Friends.API.toggle(0); } catch(e) {}
        };
        window.handleFriendsEnabled = function() { return true; };
        window.handleShowPreactivation = function() {};
    </script>
</head>
<body>
    <div id="registration-success-banner">
        <div class="banner-card">
            <div class="banner-icon">🎉</div>
            <div class="banner-content">
                <div class="banner-title">Penguin Created Successfully!</div>
                <div class="banner-text">Welcome, <strong id="created-username">Penguin</strong>! Enter your password on the login screen to start playing.</div>
            </div>
            <button class="banner-close" onclick="document.getElementById('registration-success-banner').style.display='none'">✕</button>
        </div>
    </div>

    <!--
        #D_F_GameSection is required by disney-friends-with-ui-min.js.
        Disney.ClubPenguin.getNotifyPosition() reads the size/offset of this element
        to position the HUD notification bubble near the in-game friends icon.
    -->
    <div id="D_F_GameSection">
        <div id="ruffle-container"></div>
    </div>
</body>
</html>
